<style>
/* =========================================================
   Property Management System — Design System
   Pure black & white. No build step, no frameworks, no blue.
   ========================================================= */

:root {
  --bg: #000000;
  --surface: #000000;
  --surface-2: #0e0e0e;
  --surface-hover: #1a1a1a;
  --border: #262626;
  --border-strong: #404040;
  --text: #ffffff;
  --text-secondary: #a8a8a8;
  --text-tertiary: #707070;

  --accent: #ffffff;
  --accent-soft: rgba(255, 255, 255, 0.1);
  --accent-text: #ffffff;
  --accent-contrast: #000000;

  --success: #4ade80;
  --success-soft: rgba(74, 222, 128, 0.14);
  --warning: #facc15;
  --warning-soft: rgba(250, 204, 21, 0.14);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.14);

  --radius-lg: 16px;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.6);
  --shadow-2: 0 16px 40px -14px rgba(0, 0, 0, 0.85);
  --accent-glow: rgba(255, 255, 255, 0.28);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --sidebar-w: 248px;
}

/* Light theme — still pure black & white, just inverted. Toggle in
   Settings → Theme sets data-theme="light" on <html>. */
html[data-theme="light"] {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f2f2f2;
  --surface-hover: #e6e6e6;
  --border: #dcdcdc;
  --border-strong: #bfbfbf;
  --text: #000000;
  --text-secondary: #4d4d4d;
  --text-tertiary: #767676;

  --accent: #000000;
  --accent-soft: rgba(0, 0, 0, 0.08);
  --accent-text: #000000;
  --accent-contrast: #ffffff;

  --success: #15803d;
  --success-soft: rgba(21, 128, 61, 0.12);
  --warning: #b45309;
  --warning-soft: rgba(180, 83, 9, 0.12);
  --danger: #b91c1c;
  --danger-soft: rgba(185, 28, 28, 0.12);

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.08);
  --shadow-2: 0 16px 40px -14px rgba(0, 0, 0, 0.2);
  --accent-glow: rgba(0, 0, 0, 0.18);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}
a { color: inherit; }
button { font-family: inherit; }
h1, h2, h3, p { margin: 0; }
::selection { background: var(--accent-soft); color: var(--text); }

img { max-width: 100%; display: block; }

/* ---------- Layout ---------- */
.app {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  z-index: 40;
  transition: transform 0.25s ease;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 20px;
}
.brand-mark {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent-contrast); font-weight: 700; font-size: 15px;
  flex-shrink: 0;
  box-shadow: 0 4px 16px -4px var(--accent-glow);
}
.brand-text { min-width: 0; }
.brand-title { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11px; color: var(--text-tertiary); }

.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-link {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  transition: background 0.15s ease, color 0.15s ease;
}
.nav-link svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.9; }
.nav-link:hover { background: var(--surface-hover); color: var(--text); }
.nav-link.active { background: var(--accent-soft); color: var(--accent-text); }

.sidebar-footer {
  font-size: 10.5px;
  color: var(--text-tertiary);
  padding: 10px 12px 2px;
  border-top: 1px solid var(--border);
  margin-top: 10px;
}

.sidebar-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 35;
}

.mobile-topbar {
  display: none;
  position: sticky; top: 0;
  align-items: center; gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 30;
}
.mobile-menu-btn {
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  color: var(--text);
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}

.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 22px 32px 0;
}
.topbar h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.015em; }
.topbar .sub { margin-top: 3px; font-size: 13px; color: var(--text-secondary); }
.topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }

.content {
  padding: 20px 32px 56px;
  flex: 1;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  white-space: nowrap;
  padding: 8px 14px;
  text-decoration: none;
}
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }

/* Safety net: any inline SVG icon not covered by a more specific rule
   below still needs an explicit size, or Chromium can collapse it to
   0x0 inside auto-sized flex containers (a real, confirmed bug — not
   theoretical). Specific rules after this one win via normal cascade
   order/specificity, so this only fills gaps. */
svg { width: 16px; height: 16px; flex-shrink: 0; }
.mobile-menu-btn svg { width: 20px; height: 20px; }
.btn-icon svg { width: 16px; height: 16px; }
.card-link svg { width: 14px; height: 14px; }
.stat-card .icon-wrap svg { width: 18px; height: 18px; }
.empty .icon-wrap svg { width: 22px; height: 22px; }
.lock-mark svg { width: 20px; height: 20px; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-contrast); box-shadow: 0 6px 18px -8px var(--accent-glow); }
.btn-primary:hover:not(:disabled) { filter: brightness(0.9); }
.btn-secondary { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-hover); }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { filter: brightness(1.08); }
.btn-sm { padding: 6px 11px; font-size: 12.5px; }
.btn-icon { padding: 7px; border-radius: var(--radius-sm); background: transparent; border: none; color: var(--text-secondary); cursor: pointer; display: inline-flex; }
.btn-icon:hover { background: var(--danger-soft); color: var(--danger); }
.btn-icon.neutral:hover { background: var(--surface-hover); color: var(--text); }

/* ---------- Cards / stats ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 20px;
  border-bottom: 1px solid var(--border);
}
.card-header h2 { font-size: 13.5px; font-weight: 650; }
.card-link { font-size: 12px; font-weight: 600; color: var(--accent-text); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.card-link:hover { text-decoration: underline; }
.card-body { padding: 20px; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 18px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.stat-card .icon-wrap {
  width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-2); color: var(--text-secondary);
}
.stat-card.tone-accent .icon-wrap { background: var(--accent-soft); color: var(--accent-text); }
.stat-card.tone-danger .icon-wrap { background: var(--danger-soft); color: var(--danger); }
.stat-card.tone-warning .icon-wrap { background: var(--warning-soft); color: var(--warning); }
.stat-card .value { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.stat-card .label { font-size: 12.5px; color: var(--text-secondary); font-weight: 500; }
.stat-card .sub { font-size: 11px; color: var(--text-tertiary); }

/* ---------- Grid helpers ---------- */
.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.flex-col { display: flex; flex-direction: column; gap: 6px; }
.divider-list > * + * { border-top: 1px solid var(--border); }

/* ---------- List rows ---------- */
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 20px;
}
.row .title { font-size: 13.5px; font-weight: 600; color: var(--text); }
.row .meta { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

/* ---------- Pills ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 650;
  border: 1px solid transparent;
}
.pill-success { background: var(--success-soft); color: var(--success); }
.pill-warning { background: var(--warning-soft); color: var(--warning); }
.pill-danger { background: var(--danger-soft); color: var(--danger); }
.pill-neutral { background: var(--surface-2); color: var(--text-secondary); border-color: var(--border-strong); }
.pill-accent { background: var(--accent-soft); color: var(--accent-text); }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
.field label .req { color: var(--danger); margin-left: 2px; }
.field .hint { font-size: 11px; color: var(--text-tertiary); }
.field .error { font-size: 11.5px; color: var(--danger); }
.input, select.input, textarea.input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-size: 13.5px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input.has-error { border-color: var(--danger); }
textarea.input { resize: vertical; min-height: 72px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid.single { grid-template-columns: 1fr; }

/* ---------- Filters / tabs ---------- */
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--text-secondary);
  padding: 6px 13px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.chip:hover { background: var(--surface-hover); }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }

/* ---------- Empty state ---------- */
.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 8px; padding: 40px 20px;
  color: var(--text-secondary);
}
.empty .icon-wrap {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--surface-2); color: var(--text-tertiary);
  display: flex; align-items: center; justify-content: center; margin-bottom: 6px;
}
.empty h3 { font-size: 14px; font-weight: 650; color: var(--text); }
.empty p { font-size: 12.5px; max-width: 320px; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(4, 7, 11, 0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
  backdrop-filter: blur(2px);
  animation: fadeIn 0.15s ease;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  width: 100%; max-width: 480px;
  max-height: 88vh;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-2);
  animation: slideUp 0.18s ease;
}
.modal.modal-wide { max-width: 780px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 14.5px; font-weight: 650; }
.modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ---------- Data table (bank import review, etc.) ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); }
table.data-table { width: 100%; min-width: 640px; border-collapse: collapse; text-align: left; font-size: 12.5px; }
table.data-table thead tr { border-bottom: 1px solid var(--border); background: var(--surface-2); }
table.data-table th { padding: 10px 12px; font-size: 11px; font-weight: 650; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
table.data-table td { padding: 10px 12px; border-top: 1px solid var(--border); color: var(--text-secondary); vertical-align: middle; }
table.data-table tbody tr:hover { background: var(--surface-hover); }
table.data-table tr.row-disabled { opacity: 0.45; }
table.data-table select.input, table.data-table input.input { padding: 6px 8px; font-size: 12.5px; height: auto; }
.import-summary { font-size: 12.5px; color: var(--text-secondary); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
.import-warning { font-size: 12px; color: var(--warning); background: var(--warning-soft); border: 1px solid var(--warning); border-radius: var(--radius-sm); padding: 8px 12px; }

/* ---------- Toasts ---------- */
.toast-root {
  position: fixed; top: 16px; right: 16px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
  max-width: 320px;
}
.toast {
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--accent);
  color: var(--text);
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  font-weight: 500;
  box-shadow: var(--shadow-2);
  animation: slideUp 0.18s ease;
}
.toast.error { border-left-color: var(--danger); }
.toast.info { border-left-color: var(--text-tertiary); }

/* ---------- Accent swatches ---------- */
.swatch-row { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch {
  width: 40px; height: 40px; border-radius: 999px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.12s ease;
}
.swatch:hover { transform: scale(1.06); }
.swatch.active { border-color: var(--text); }

/* ---------- Skeleton ---------- */
.skeleton { background: var(--surface-2); border-radius: var(--radius); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* ---------- Utility ---------- */
.text-secondary { color: var(--text-secondary); }
.text-tertiary { color: var(--text-tertiary); }
.mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 14px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.min-w-0 { min-width: 0; }
.hidden { display: none !important; }
.logo-preview {
  width: 64px; height: 64px; border-radius: var(--radius);
  border: 1px solid var(--border-strong); background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
}
.logo-preview img { width: 100%; height: 100%; object-fit: contain; }

/* ---------- Lock screen (access-code gate) ---------- */
html:not(.unlocked) #app-shell,
html:not(.unlocked) .mobile-topbar {
  display: none !important;
}
.lock-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  padding: 20px;
}
.lock-card {
  width: 100%; max-width: 360px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 32px 28px;
  text-align: center;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: var(--shadow-2);
}
.lock-mark {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-contrast);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 18px;
  margin: 0 auto 4px;
}
.lock-card h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.lock-card p.lock-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: -8px; }
.lock-card .lock-error {
  display: none;
  font-size: 12px;
  color: var(--danger);
  margin-top: -6px;
}
.lock-card .lock-error.show { display: block; }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); box-shadow: var(--shadow-2); }
  body.sidebar-open .sidebar { transform: translateX(0); }
  body.sidebar-open .sidebar-backdrop { display: block; }
  .main { margin-left: 0; }
  .mobile-topbar { display: flex; }
  .topbar { padding: 18px 18px 0; flex-wrap: wrap; }
  .content { padding: 16px 18px 48px; }
  .topbar-actions .btn span.long { display: none; }
}

</style>
</head>
<body data-page="finances">
<div id="app-shell"></div>
<div class="toast-root" id="toast-root"></div>
<div id="modal-root"></div>

<script>

   ---------------------------------------------------------
   HOW TO SET YOUR OWN PASSWORD:
   Change the text between the quotes on the next line to

/* =========================================================
   IMPORTANT — read this before you rely on it:
   This is a simple front-door lock, not real security. This
   app has no server, so the code above lives inside the page
   itself — anyone who opens their browser's "View Page
   Source" or Developer Tools can read it. It's enough to stop
   casual visitors and people who don't have the code you gave
   them, but do not use it to protect anything truly sensitive,

(function () {

        '<div class="lock-mark">&#128274;</div>' +
        "<h1>Enter Access Code</h1>" +
        '<p class="lock-sub">Ask whoever set you up with this app for your access code.</p>' +
        '<input type="password" class="input" id="gateInput" placeholder="Access code" autocomplete="off" />' +
        '<p class="lock-error" id="gateError">That code isn\'t right. Try again.</p>' +
        '<button class="btn btn-primary" id="gateBtn" style="width:100%;justify-content:center;">Unlock</button>' +
      "</div>";
    document.body.appendChild(overlay);

    var input = overlay.querySelector("#gateInput");
    var err = overlay.querySelector("#gateError");

    function attempt() {
      if (input.value === ACCESS_CODE) {
        markUnlocked();
        overlay.remove();
      } else {
        err.classList.add("show");
        input.value = "";
        input.focus();
      }
    }

    overlay.querySelector("#gateBtn").addEventListener("click", attempt);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") attempt();
    });
    setTimeout(function () { input.focus(); }, 60);
  }

  if (isUnlocked()) {
    document.documentElement.classList.add("unlocked");
  } else {
    document.documentElement.classList.remove("unlocked");
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", showLockScreen);
    } else {
      showLockScreen();
    }
  }
})();

<script>
/* =========================================================
   Property Management System — Data Layer
   Plain JavaScript, no build step. All data lives in this
   browser's localStorage. Loaded before every other script.
   ========================================================= */

(function (global) {
  "use strict";

  var STORAGE_KEY = "pms_data_v1";
  var SCHEMA_VERSION = 1;

  var DEFAULT_SETTINGS = {
    landlordName: "Your Company",
    email: "",
    phone: "",
    address: "",
    currency: "USD",
    customSymbol: "",
    theme: "dark",
    defaultDueDay: 1,
    reminderLeadDays: 5,
    accentColor: "blue",
    logoDataUrl: null,
    invoicePrefix: "INV-",
    nextInvoiceNumber: 1,
    leaseRenewalLeadDays: 60,
    // Preset invoice line items a landlord bills often (rent, utilities,
    // etc.) with a fixed unit price, so invoicing doesn't mean re-typing
    // the same description and rate every time. Fully editable in
    // Settings — this is just a sensible starting point for a new
    // portfolio, not a fixed list.
    chargeItems: [
      { id: "preset-rental", description: "Rental", unitPrice: 0 },
      { id: "preset-electricity", description: "Electricity", unitPrice: 0 },
      { id: "preset-water", description: "Water", unitPrice: 0 },
      { id: "preset-refuse", description: "Refuse", unitPrice: 0 },
      { id: "preset-sewerage", description: "Sewerage", unitPrice: 0 },
    ],
  };

  function emptyData() {
    return {
      version: SCHEMA_VERSION,
      properties: [],
      tenants: [],
      leases: [],
      rentPayments: [],
      maintenanceRequests: [],
      expenses: [],
      invoices: [],
      creditNotes: [],
      settings: Object.assign({}, DEFAULT_SETTINGS),
    };
  }

  // ---- in-memory fallback in case localStorage is unavailable
  // (private browsing, disabled storage, etc.)
  var memoryFallback = null;

  function safeGetItem() {
    try {
      return window.localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      return memoryFallback;
    }
  }
  function safeSetItem(value) {
    try {
      window.localStorage.setItem(STORAGE_KEY, value);
    } catch (e) {
      memoryFallback = value;
    }
  }

  function load() {
    var raw = safeGetItem();
    if (!raw) return emptyData();
    try {
      var parsed = JSON.parse(raw);
      var base = emptyData();
      return Object.assign({}, base, parsed, {
        settings: Object.assign({}, DEFAULT_SETTINGS, parsed.settings || {}),
        properties: parsed.properties || [],
        tenants: parsed.tenants || [],
        leases: parsed.leases || [],
        rentPayments: parsed.rentPayments || [],
        maintenanceRequests: parsed.maintenanceRequests || [],
        expenses: parsed.expenses || [],
        invoices: parsed.invoices || [],
        creditNotes: parsed.creditNotes || [],
      });
    } catch (e) {
      console.warn("PMS: could not parse saved data, starting fresh.", e);
      return emptyData();
    }
  }

  var data = load();

  function persist() {
    safeSetItem(JSON.stringify(data));
  }

  // ---------- helpers ----------
  function uid() {
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }
  function nowISO() {
    return new Date().toISOString();
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function pad2(n) {
    return n < 10 ? "0" + n : "" + n;
  }
  function pad4(n) {
    var s = "" + n;
    while (s.length < 4) s = "0" + s;
    return s;
  }

  // ---------- properties ----------
  function addProperty(input) {
    var rec = Object.assign({}, input, { id: uid(), createdAt: nowISO() });
    data.properties.push(rec);
    persist();
    return rec;
  }
  function updateProperty(id, patch) {
    var p = data.properties.find(function (x) { return x.id === id; });
    if (!p) return;
    Object.assign(p, patch);
    persist();
  }
  function deleteProperty(id) {
    data.properties = data.properties.filter(function (x) { return x.id !== id; });
    var leaseIds = data.leases.filter(function (l) { return l.propertyId === id; }).map(function (l) { return l.id; });
    data.leases = data.leases.filter(function (l) { return l.propertyId !== id; });
    data.rentPayments = data.rentPayments.filter(function (rp) { return leaseIds.indexOf(rp.leaseId) === -1; });
    data.maintenanceRequests = data.maintenanceRequests.filter(function (m) { return m.propertyId !== id; });
    data.expenses = data.expenses.filter(function (e) { return e.propertyId !== id; });
    data.invoices = data.invoices.filter(function (inv) { return inv.propertyId !== id; });
    data.creditNotes = data.creditNotes.filter(function (cn) { return cn.propertyId !== id; });
    persist();
  }
  function activeLeaseForProperty(propertyId) {
    return data.leases.find(function (l) { return l.propertyId === propertyId && l.status === "active"; }) || null;
  }

  // ---------- tenants ----------
  function addTenant(input) {
    var rec = Object.assign({}, input, { id: uid(), createdAt: nowISO() });
    data.tenants.push(rec);
    persist();
    return rec;
  }
  function updateTenant(id, patch) {
    var t = data.tenants.find(function (x) { return x.id === id; });
    if (!t) return;
    Object.assign(t, patch);
    persist();
  }
  function deleteTenant(id) {
    data.tenants = data.tenants.filter(function (x) { return x.id !== id; });
    persist();
  }

  // ---------- leases ----------
  function addLease(input) {
    var rec = Object.assign({}, input, { id: uid(), status: "active", createdAt: nowISO() });
    data.leases.push(rec);
    persist();
    return rec;
  }
  function endLease(id) {
    var l = data.leases.find(function (x) { return x.id === id; });
    if (!l) return;
    l.status = "ended";
    l.endDate = todayISO();
    persist();
  }
  function updateLease(id, patch) {
    var l = data.leases.find(function (x) { return x.id === id; });
    if (!l) return;
    Object.assign(l, patch);
    persist();
  }
  function deleteLease(id) {
    data.leases = data.leases.filter(function (x) { return x.id !== id; });
    data.rentPayments = data.rentPayments.filter(function (rp) { return rp.leaseId !== id; });
    persist();
  }

  // ---------- rent payments ----------
  function addRentPayment(input) {
    var rec = Object.assign({}, input, { id: uid(), createdAt: nowISO() });
    data.rentPayments.push(rec);
    persist();
    return rec;
  }
  function deleteRentPayment(id) {
    data.rentPayments = data.rentPayments.filter(function (x) { return x.id !== id; });
    persist();
  }

  // ---------- maintenance ----------
  function addMaintenanceRequest(input) {
    var rec = Object.assign({}, input, { id: uid(), createdAt: nowISO() });
    data.maintenanceRequests.push(rec);
    persist();
    return rec;
  }
  function updateMaintenanceRequest(id, patch) {
    var m = data.maintenanceRequests.find(function (x) { return x.id === id; });
    if (!m) return;
    Object.assign(m, patch);
    persist();
  }
  function deleteMaintenanceRequest(id) {
    data.maintenanceRequests = data.maintenanceRequests.filter(function (x) { return x.id !== id; });
    persist();
  }

  // ---------- expenses (insurance, levy, loan payments, etc.) ----------
  function addExpense(input) {
    var rec = Object.assign({}, input, { id: uid(), createdAt: nowISO() });
    data.expenses.push(rec);
    persist();
    return rec;
  }
  function updateExpense(id, patch) {
    var e = data.expenses.find(function (x) { return x.id === id; });
    if (!e) return;
    Object.assign(e, patch);
    persist();
  }
  function deleteExpense(id) {
    data.expenses = data.expenses.filter(function (x) { return x.id !== id; });
    persist();
  }

  // ---------- tenant invoices ----------
  // Invoice numbers are assigned once, here, from a running counter kept in
  // settings — never derived from the invoice list length, so deleting an
  // invoice can never cause a later one to reuse its number.
  function peekNextInvoiceNumber() {
    return (data.settings.invoicePrefix || "") + pad4(data.settings.nextInvoiceNumber || 1);
  }
  function addInvoice(input) {
    var invoiceNumber = peekNextInvoiceNumber();
    var rec = Object.assign({}, input, { id: uid(), invoiceNumber: invoiceNumber, createdAt: nowISO() });
    data.invoices.push(rec);
    data.settings.nextInvoiceNumber = (data.settings.nextInvoiceNumber || 1) + 1;
    persist();
    return rec;
  }
  function updateInvoice(id, patch) {
    var inv = data.invoices.find(function (x) { return x.id === id; });
    if (!inv) return;
    Object.assign(inv, patch);
    persist();
  }
  function deleteInvoice(id) {
    data.invoices = data.invoices.filter(function (x) { return x.id !== id; });
    persist();
  }

  // ---------- credit notes ----------
  // A credit note reduces what a tenant owes without being cash received --
  // a deposit refund, a discount, a billing correction, a bad-debt write-off.
  // Distinct from a rentPayment (money actually received) and from an
  // invoice (a new charge). Shows up on that tenant's Statement as a credit
  // against their balance.
  function addCreditNote(input) {
    var rec = Object.assign({}, input, { id: uid(), createdAt: nowISO() });
    data.creditNotes.push(rec);
    persist();
    return rec;
  }
  function updateCreditNote(id, patch) {
    var cn = data.creditNotes.find(function (x) { return x.id === id; });
    if (!cn) return;
    Object.assign(cn, patch);
    persist();
  }
  function deleteCreditNote(id) {
    data.creditNotes = data.creditNotes.filter(function (x) { return x.id !== id; });
    persist();
  }

  // ---------- settings ----------
  function updateSettings(patch) {
    data.settings = Object.assign({}, data.settings, patch);
    persist();
  }

  // ---------- charge item presets (Settings) ----------
  // Stored on settings.chargeItems. These functions always build new
  // arrays/objects rather than mutating in place, so a fresh install's
  // default presets (shared object literal in DEFAULT_SETTINGS) are never
  // accidentally edited through a live data reference.
  function addChargeItem(input) {
    var rec = Object.assign({}, input, { id: uid() });
    data.settings.chargeItems = (data.settings.chargeItems || []).concat([rec]);
    persist();
    return rec;
  }
  function updateChargeItem(id, patch) {
    data.settings.chargeItems = (data.settings.chargeItems || []).map(function (x) {
      return x.id === id ? Object.assign({}, x, patch) : x;
    });
    persist();
  }
  function deleteChargeItem(id) {
    data.settings.chargeItems = (data.settings.chargeItems || []).filter(function (x) { return x.id !== id; });
    persist();
  }

  // ---------- rent math ----------
  function currentPeriodLabel(refISO) {
    var d = refISO ? new Date(refISO + "T00:00:00") : new Date();
    var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    return months[d.getMonth()] + " " + d.getFullYear();
  }
  function periodKey(refISO) {
    var d = refISO ? new Date(refISO + "T00:00:00") : new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
  }
  function daysInMonth(year, monthIndex) {
    return new Date(year, monthIndex + 1, 0).getDate();
  }
  function dueDateForCurrentPeriod(dueDay, refISO) {
    var ref = refISO ? new Date(refISO + "T00:00:00") : new Date();
    var year = ref.getFullYear();
    var month = ref.getMonth();
    var clampedDay = Math.min(Math.max(dueDay || 1, 1), daysInMonth(year, month));
    var due = new Date(year, month, clampedDay);
    return due.getFullYear() + "-" + pad2(due.getMonth() + 1) + "-" + pad2(due.getDate());
  }
  function daysBetween(fromISO, toISO) {
    var from = new Date(fromISO + "T00:00:00");
    var to = new Date(toISO + "T00:00:00");
    return Math.round((to.getTime() - from.getTime()) / 86400000);
  }
  function amountPaidForPeriod(leaseId, period) {
    return data.rentPayments
      .filter(function (rp) { return rp.leaseId === leaseId && rp.periodLabel === period; })
      .reduce(function (sum, rp) { return sum + rp.amount; }, 0);
  }
  function computeLeaseRentInfo(lease, reminderLeadDays, todayOverride) {
    var today = todayOverride || todayISO();
    var period = currentPeriodLabel(today);
    var dueDate = dueDateForCurrentPeriod(lease.dueDay, today);
    // If this tenant has an invoice for the current period (e.g. rent plus
    // an electricity line item), what they actually owe is the invoice
    // total rather than the flat lease rent. With no invoice for the
    // period this falls back to lease.rentAmount exactly as before, so
    // landlords who never touch invoicing see no change in behavior.
    var periodInvoices = data.invoices.filter(function (inv) { return inv.leaseId === lease.id && inv.periodLabel === period; });
    var invoiced = periodInvoices.length > 0;
    var amountOwed = invoiced ? periodInvoices.reduce(function (sum, inv) { return sum + inv.total; }, 0) : lease.rentAmount;
    var paid = amountPaidForPeriod(lease.id, period);
    var balance = Math.max(amountOwed - paid, 0);
    var daysUntilDue = daysBetween(today, dueDate);
    var status;
    if (balance <= 0) status = "paid";
    else if (daysUntilDue < 0) status = "overdue";
    else if (daysUntilDue <= (reminderLeadDays || 0)) status = "due-soon";
    else status = "upcoming";
    return { lease: lease, period: period, dueDate: dueDate, daysUntilDue: daysUntilDue, paid: paid, balance: balance, status: status, amountOwed: amountOwed, invoiced: invoiced };
  }
  // ---------- lease renewal ----------
  function daysUntilLeaseEnd(lease, todayOverride) {
    if (!lease.leaseEndDate) return null;
    return daysBetween(todayOverride || todayISO(), lease.leaseEndDate);
  }
  function leaseRenewalCandidates(leadDays, todayOverride) {
    return data.leases
      .filter(function (l) { return l.status === "active" && l.leaseEndDate; })
      .map(function (l) { return { lease: l, daysUntilEnd: daysUntilLeaseEnd(l, todayOverride) }; })
      .filter(function (r) { return r.daysUntilEnd <= (leadDays || 0); })
      .sort(function (a, b) { return a.daysUntilEnd - b.daysUntilEnd; });
  }
  // ---------- vacancy ----------
  function vacancyInfo(propertyId, todayOverride) {
    var active = activeLeaseForProperty(propertyId);
    if (active) return { occupied: true, days: null, vacantSince: null };
    var endedLeases = data.leases
      .filter(function (l) { return l.propertyId === propertyId && l.status === "ended"; })
      .sort(function (a, b) { return (b.endDate || "") < (a.endDate || "") ? -1 : 1; });
    var property = data.properties.find(function (p) { return p.id === propertyId; });
    var vacantSince = (endedLeases[0] && endedLeases[0].endDate) || (property && property.createdAt ? property.createdAt.slice(0, 10) : todayISO());
    var days = daysBetween(vacantSince, todayOverride || todayISO());
    return { occupied: false, days: days, vacantSince: vacantSince };
  }

  // ---------- formatting ----------
  // code -> [locale, symbol]. Locale mainly affects number grouping; the
  // symbol here is only used for the Settings dropdown preview and as a
  // fallback if Intl can't format a given code in this browser.
  // Suggested expense categories — shown as autocomplete suggestions, but
  // the field itself is free text so a landlord can type any category they
  // want ("HOA Fees", "Pest Control", etc.) without it being a fixed list.
  var EXPENSE_CATEGORIES = ["Maintenance", "Insurance", "Property Tax / Levy", "Bank Loan Payment", "Utility Bill", "Management Fee", "Other"];

  // Suggested credit note reasons -- same free-text-with-suggestions pattern
  // as expense categories above.
  var CREDIT_NOTE_REASONS = ["Deposit Refund", "Discount", "Refund", "Billing Correction", "Write-off", "Needs Review", "Other"];

  var CURRENCY_META = {
    USD: ["en-US", "$"], EUR: ["de-DE", "€"], GBP: ["en-GB", "£"], INR: ["en-IN", "₹"],
    AUD: ["en-AU", "$"], CAD: ["en-CA", "$"], NZD: ["en-NZ", "$"], SGD: ["en-SG", "$"],
    HKD: ["en-HK", "$"], JPY: ["ja-JP", "¥"], CNY: ["zh-CN", "¥"], KRW: ["ko-KR", "₩"],
    CHF: ["de-CH", "CHF"], SEK: ["sv-SE", "kr"], NOK: ["nb-NO", "kr"], DKK: ["da-DK", "kr"],
    PLN: ["pl-PL", "zł"], CZK: ["cs-CZ", "Kč"], HUF: ["hu-HU", "Ft"], RON: ["ro-RO", "lei"],
    TRY: ["tr-TR", "₺"], RUB: ["ru-RU", "₽"], ZAR: ["en-ZA", "R"], NGN: ["en-NG", "₦"],
    EGP: ["ar-EG", "E£"], KES: ["en-KE", "KSh"], AED: ["ar-AE", "د.إ"], SAR: ["ar-SA", "﷼"],
    QAR: ["ar-QA", "﷼"], KWD: ["ar-KW", "د.ك"], ILS: ["he-IL", "₪"], THB: ["th-TH", "฿"],
    IDR: ["id-ID", "Rp"], MYR: ["ms-MY", "RM"], PHP: ["en-PH", "₱"], VND: ["vi-VN", "₫"],
    PKR: ["en-PK", "₨"], BDT: ["bn-BD", "৳"], LKR: ["en-LK", "₨"], NPR: ["ne-NP", "₨"],
    BRL: ["pt-BR", "R$"], MXN: ["es-MX", "$"], ARS: ["es-AR", "$"], CLP: ["es-CL", "$"],
    COP: ["es-CO", "$"], PEN: ["es-PE", "S/"], TWD: ["zh-TW", "NT$"],
  };
  function currencySymbol(code) {
    var meta = CURRENCY_META[code];
    return meta ? meta[1] : code;
  }
  function formatCurrency(amount, currency) {
    var amt = amount || 0;
    // Always show 2 decimal places (cents) -- this is a financial app, and
    // rounding to whole units on-screen (e.g. showing "R100" for R100.09)
    // hides real balances and invoice totals from the landlord.
    var customSymbol = data.settings && data.settings.customSymbol;
    if (customSymbol) {
      var numStr = Math.abs(amt).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return (amt < 0 ? "-" : "") + customSymbol + numStr;
    }
    var cur = currency || "USD";
    var meta = CURRENCY_META[cur];
    try {
      return new Intl.NumberFormat((meta && meta[0]) || "en-US", { style: "currency", currency: cur, minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amt);
    } catch (e) {
      return (amt < 0 ? "-" : "") + currencySymbol(cur) + Math.abs(amt).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
  }
  function formatDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  // ---------- backup / restore ----------
  function exportData() {
    return JSON.stringify(data, null, 2);
  }
  function importData(json) {
    try {
      var parsed = JSON.parse(json);
      if (!parsed || typeof parsed !== "object") return { ok: false, error: "That file doesn't look like a valid backup." };
      var base = emptyData();
      data = Object.assign({}, base, parsed, {
        settings: Object.assign({}, DEFAULT_SETTINGS, parsed.settings || {}),
        properties: parsed.properties || [],
        tenants: parsed.tenants || [],
        leases: parsed.leases || [],
        rentPayments: parsed.rentPayments || [],
        maintenanceRequests: parsed.maintenanceRequests || [],
        expenses: parsed.expenses || [],
        invoices: parsed.invoices || [],
        creditNotes: parsed.creditNotes || [],
      });
      persist();
      return { ok: true };
    } catch (e) {
      return { ok: false, error: "Could not read that file. Make sure it's an unedited backup .json file." };
    }
  }
  function resetAllData() {
    data = emptyData();
    persist();
  }

  global.PMS = {
    getData: function () { return data; },
    uid: uid,
    nowISO: nowISO,
    todayISO: todayISO,

    addProperty: addProperty,
    updateProperty: updateProperty,
    deleteProperty: deleteProperty,
    activeLeaseForProperty: activeLeaseForProperty,

    addTenant: addTenant,
    updateTenant: updateTenant,
    deleteTenant: deleteTenant,

    addLease: addLease,
    endLease: endLease,
    updateLease: updateLease,
    deleteLease: deleteLease,

    addRentPayment: addRentPayment,
    deleteRentPayment: deleteRentPayment,

    addMaintenanceRequest: addMaintenanceRequest,
    updateMaintenanceRequest: updateMaintenanceRequest,
    deleteMaintenanceRequest: deleteMaintenanceRequest,

    addExpense: addExpense,
    updateExpense: updateExpense,
    deleteExpense: deleteExpense,

    addInvoice: addInvoice,
    updateInvoice: updateInvoice,
    deleteInvoice: deleteInvoice,
    peekNextInvoiceNumber: peekNextInvoiceNumber,

    addCreditNote: addCreditNote,
    updateCreditNote: updateCreditNote,
    deleteCreditNote: deleteCreditNote,

    updateSettings: updateSettings,
    addChargeItem: addChargeItem,
    updateChargeItem: updateChargeItem,
    deleteChargeItem: deleteChargeItem,

    currentPeriodLabel: currentPeriodLabel,
    periodKey: periodKey,
    dueDateForCurrentPeriod: dueDateForCurrentPeriod,
    computeLeaseRentInfo: computeLeaseRentInfo,
    daysUntilLeaseEnd: daysUntilLeaseEnd,
    leaseRenewalCandidates: leaseRenewalCandidates,
    vacancyInfo: vacancyInfo,
    daysBetween: daysBetween,

    formatCurrency: formatCurrency,
    formatDate: formatDate,
    currencySymbol: currencySymbol,
    CURRENCY_CODES: Object.keys(CURRENCY_META),
    EXPENSE_CATEGORIES: EXPENSE_CATEGORIES,
    CREDIT_NOTE_REASONS: CREDIT_NOTE_REASONS,

    exportData: exportData,
    importData: importData,
    resetAllData: resetAllData,
  };
})(window);

</script>

  var NAV_ITEMS = [
    { key: "dashboard", label: "Dashboard", href: "index.html", icon: ICONS.dashboard },

    { key: "maintenance", label: "Maintenance", href: "maintenance.html", icon: ICONS.maintenance },
    { key: "finances", label: "Finances", href: "finances.html", icon: ICONS.finances },

  ];

  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function applyAccent() {
    var settings = PMS.getData().settings;
    document.documentElement.setAttribute("data-accent", settings.accentColor || "blue");
    document.documentElement.setAttribute("data-theme", settings.theme || "dark");
  }

  function renderShell(activeKey) {
    applyAccent();
    var navHtml = NAV_ITEMS.map(function (item) {
      var isActive = item.key === activeKey;
      return (
        '<a class="nav-link' + (isActive ? " active" : "") + '" href="' + item.href + '">' +
        item.icon + "<span>" + item.label + "</span></a>"
      );
    }).join("");

    var shellHtml =
      '<div class="mobile-topbar">' +
        '<button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">' + ICONS.menu + "</button>" +

      "</div>" +
      '<div class="app">' +
        '<div class="sidebar-backdrop" id="sidebarBackdrop"></div>' +
        '<aside class="sidebar" id="sidebar">' +
          '<div class="brand"><div class="brand-mark">P</div><div class="brand-text"><div class="brand-title">Property Manager</div><div class="brand-sub">Landlord dashboard</div></div></div>' +
          '<nav class="nav">' + navHtml + "</nav>" +

        "</div>" +

    var root = document.getElementById("app-shell");

  // ---------- toast ----------

    root.appendChild(node);
    setTimeout(function () {
      node.style.transition = "opacity 0.25s ease";
      node.style.opacity = "0";
      setTimeout(function () { node.remove(); }, 250);

  // ---------- modal ----------
  function openModal(opts) {
    var root = document.getElementById("modal-root");

      '<div class="modal-backdrop">' +
        '<div class="modal' + (opts.wide ? " modal-wide" : "") + '" role="dialog" aria-modal="true">' +

          '<div class="modal-body" id="modalBody"></div>' +
          '<div class="modal-footer" id="modalFooter"></div>' +
        "</div>" +
      "</div>"
    );
    root.appendChild(backdrop);
    var bodyEl = backdrop.querySelector("#modalBody");
    var footerEl = backdrop.querySelector("#modalFooter");
    if (opts.body instanceof Node) bodyEl.appendChild(opts.body);
    else bodyEl.innerHTML = opts.body || "";
    if (opts.footer instanceof Node) footerEl.appendChild(opts.footer);
    else footerEl.innerHTML = opts.footer || "";

    function close() { backdrop.remove(); }
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) close(); });
    backdrop.querySelector("#modalCloseBtn").addEventListener("click", close);

    if (opts.onMount) opts.onMount(backdrop, close);
    return { close: close, el: backdrop };

  function confirmDialog(opts) {

        root.querySelector("#cdCancel").addEventListener("click", close);
        root.querySelector("#cdConfirm").addEventListener("click", function () {
          close();
          opts.onConfirm();

    });

  // ---------- lazy CDN script loading (used for optional heavy features
  // like reading/writing Excel files, so pages that never touch them don't
  // pay for the download) ----------
  var XLSX_SCRIPT = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  var loadedScripts = {};
  function loadScript(src) {
    if (loadedScripts[src]) return loadedScripts[src];
    loadedScripts[src] = new Promise(function (resolve, reject) {
      var existing = document.querySelector('script[data-src="' + src + '"]');
      if (existing) { existing.addEventListener("load", resolve); existing.addEventListener("error", reject); return; }
      var s = document.createElement("script");
      s.src = src;
      s.setAttribute("data-src", src);
      s.onload = resolve;
      s.onerror = function () { reject(new Error("Failed to load " + src)); };
      document.head.appendChild(s);
    });
    return loadedScripts[src];
  }

  // rows: array of plain objects — the keys of the FIRST row become the
  // header row, in that order. Returns a Promise that resolves once the
  // browser's file-save dialog has been triggered.
  function downloadWorkbook(sheetName, rows, filename) {
    return downloadWorkbookMulti([{ name: sheetName, rows: rows }], filename);
  }

  // Fits a rough column width to each sheet's longest cell — SheetJS's free
  // build has no cell styling (no bold, no fills), so readable columns are
  // the one polish lever available for these exports.
  function autoSizeColumns(rows) {
    if (!rows.length) return undefined;
    var keys = Object.keys(rows[0]);
    return keys.map(function (k) {
      var maxLen = rows.reduce(function (m, r) {
        var v = r[k];
        return Math.max(m, String(v == null ? "" : v).length);
      }, k.length);
      return { wch: Math.min(Math.max(maxLen + 2, 10), 48) };
    });
  }

  // sheets: array of { name, rows } — each rows array's first-row keys
  // become that sheet's header row.
  function downloadWorkbookMulti(sheets, filename) {
    return loadScript(XLSX_SCRIPT).then(function () {
      var wb = global.XLSX.utils.book_new();
      sheets.forEach(function (sheet) {
        var rows = sheet.rows || [];
        var ws = global.XLSX.utils.json_to_sheet(rows.length ? rows : [{}]);
        if (rows.length) ws["!cols"] = autoSizeColumns(rows);
        global.XLSX.utils.book_append_sheet(wb, ws, String(sheet.name).slice(0, 31));
      });
      global.XLSX.writeFile(wb, filename);
    });
  }

  // ---------- printable document window ----------
  // Opens a new tab with a minimal, self-contained print-friendly page and
  // triggers the browser's print dialog — this is how invoices/statements
  // become PDFs, with no external library and no server needed ("Save as
  // PDF" is a print destination in every modern browser). Styled as a
  // proper letterhead document: serif display type for the identity block,
  // a bold rule, zebra-striped tables, a highlighted total — kept strictly
  // black/white/grey to match the app's own monochrome identity rather
  // than introducing a color that would clash with it.
  var PRINT_CSS =
    "@media print{@page{margin:16mm 14mm;}}" +
    "*{box-sizing:border-box;}" +
    "body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;padding:44px;max-width:800px;margin:0 auto;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact;}" +
    "h1{font-family:Georgia,'Times New Roman',serif;font-size:25px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em;}" +
    "h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#555;margin:26px 0 8px;}" +
    ".muted{color:#666;font-size:12px;margin:1px 0;}" +
    ".letterhead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;}" +
    ".company-block .logo{max-height:44px;max-width:220px;margin-bottom:10px;display:block;}" +
    ".doc-block{text-align:right;min-width:180px;}" +
    ".doc-type{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:700;letter-spacing:.04em;margin-bottom:6px;}" +
    ".doc-meta{font-size:12px;color:#444;margin:2px 0;}" +
    ".doc-meta span{color:#888;display:inline-block;min-width:64px;}" +
    ".doc-number{display:inline-block;font-weight:700;font-size:13px;background:#111;color:#fff;padding:3px 10px;border-radius:3px;letter-spacing:.02em;margin-bottom:6px;}" +
    ".rule{border:none;border-top:2.5px solid #111;margin:20px 0 0;}" +
    ".bill-to{background:#f6f6f6;border-radius:6px;padding:14px 16px;margin-top:22px;}" +
    ".bill-to .label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888;margin-bottom:4px;}" +
    ".bill-to .name{font-weight:700;font-size:14px;}" +
    "table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}" +
    "thead tr{border-bottom:2px solid #111;}" +
    "th{text-align:left;padding:9px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#333;}" +
    "td{padding:10px;border-bottom:1px solid #eee;}" +
    "tbody tr:nth-child(even){background:#fafafa;}" +
    "td.num,th.num{text-align:right;}" +
    ".total-row td{border-top:2px solid #111;border-bottom:none;font-weight:700;font-size:15px;padding-top:14px;background:#fff !important;}" +
    ".total-box{margin-top:10px;display:flex;justify-content:flex-end;}" +
    ".total-box .inner{background:#111;color:#fff;padding:12px 20px;border-radius:6px;min-width:220px;display:flex;justify-content:space-between;align-items:center;gap:20px;}" +
    ".total-box .inner .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.75;}" +
    ".total-box .inner .value{font-size:19px;font-weight:700;}" +
    ".doc-footer{margin-top:36px;padding-top:14px;border-top:1px solid #ddd;display:flex;justify-content:space-between;gap:20px;}" +
    ".doc-footer .thanks{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:13px;color:#333;}" +
    ".doc-footer .stamp{font-size:10.5px;color:#999;text-align:right;}" +
    ".sig-row{display:flex;gap:40px;margin-top:48px;}" +
    ".sig-line{flex:1;border-top:1px solid #999;padding-top:6px;font-size:11px;color:#777;}" +
    "@media print{body{padding:0;}}";

  function printLetterhead(settings, docType, docNumber, metaLines) {
    return (
      '<div class="letterhead">' +
        '<div class="company-block">' +
          (settings.logoDataUrl ? '<img class="logo" src="' + settings.logoDataUrl + '" />' : "") +
          "<h1>" + escapeHtml(settings.landlordName || "Property Management") + "</h1>" +
          (settings.address ? '<p class="muted">' + escapeHtml(settings.address) + "</p>" : "") +
          [settings.email, settings.phone].filter(Boolean).map(function (v) { return '<p class="muted">' + escapeHtml(v) + "</p>"; }).join("") +
        "</div>" +
        '<div class="doc-block">' +
          '<div class="doc-type">' + escapeHtml(docType) + "</div>" +
          (docNumber ? '<div class="doc-number">' + escapeHtml(docNumber) + "</div>" : "") +
          metaLines.map(function (m) { return '<p class="doc-meta"><span>' + escapeHtml(m.label) + "</span>" + escapeHtml(m.value) + "</p>"; }).join("") +
        "</div>" +
      "</div>" +
      '<hr class="rule"/>'
    );
  }

  function openPrintWindow(title, bodyHtml) {
    var win = window.open("", "_blank");
    if (!win) { toast("Your browser blocked the print window pop-up — allow pop-ups for this site and try again.", "error"); return; }
    win.document.write(
      "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>" + escapeHtml(title) + "</title>" +
      "<style>" + PRINT_CSS + "</style></head><body>" + bodyHtml +
      // Split across concatenated string pieces on purpose (and this
      // comment avoids writing the literal tag text too): this whole file
      // gets inlined into a real script element by the build step, and
      // that exact closing-tag text appearing anywhere in this file's raw
      // source (even in a string or comment) would make the HTML parser
      // end ui.js's own script block early, truncating everything after.
      "<" + "script>window.onload=function(){setTimeout(function(){window.print();},150);};" + "<" + "/script>" +
      "</body></html>"
    );
    win.document.close();
  }

  // ---------- small helpers ----------
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function emptyState(iconKey, title, desc, actionHtml) {
    return (
      '<div class="empty"><div class="icon-wrap">' + (ICONS[iconKey] || "") + "</div>" +
      "<h3>" + escapeHtml(title) + "</h3><p>" + escapeHtml(desc) + "</p>" +
      (actionHtml ? '<div class="mt-2">' + actionHtml + "</div>" : "") +
      "</div>"
    );
  }

  global.PMSUI = {
    ICONS: ICONS,
    renderShell: renderShell,
    toast: toast,
    openModal: openModal,
    confirmDialog: confirmDialog,
    escapeHtml: escapeHtml,
    emptyState: emptyState,
    el: el,
    applyAccent: applyAccent,
    BUILD_DATE: BUILD_DATE,
    loadScript: loadScript,
    downloadWorkbook: downloadWorkbook,
    downloadWorkbookMulti: downloadWorkbookMulti,
    openPrintWindow: openPrintWindow,
    printLetterhead: printLetterhead,
  };
})(window);

</script>
<script>
/* Finances page — expense log + per-property income/expense summary */
(function () {
  "use strict";

  var shell = PMSUI.renderShell("finances");
  var data = PMS.getData();

  function firstOfMonthISO() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() < 9 ? "0" : "") + (d.getMonth() + 1) + "-01";
  }

  var filters = { propertyId: "all", from: firstOfMonthISO(), to: PMS.todayISO() };

  shell.setTitle("Finances", "Income and spending across your portfolio.");
  shell.setActions(
    '<button class="btn btn-secondary" id="exportBtn">' + PMSUI.ICONS.download + '<span class="long">Export to Excel</span></button>' +
    '<button class="btn btn-primary" id="addExpenseBtn"' + (data.properties.length === 0 ? " disabled" : "") + ">" + PMSUI.ICONS.plus + '<span class="long">Log Expense</span></button>'
  );

  function propertyName(id) { var p = data.properties.find(function (x) { return x.id === id; }); return p ? p.name : "Unknown property"; }
  function inRange(iso) { return iso >= filters.from && iso <= filters.to; }
  function matchesProperty(propertyId) { return filters.propertyId === "all" || filters.propertyId === propertyId; }
  function leasePropertyId(leaseId) {
    var l = data.leases.find(function (x) { return x.id === leaseId; });
    return l ? l.propertyId : null;
  }

  // ---------- pull together everything in range, once per render ----------
  function computeLedger() {
    var rows = [];

    data.rentPayments.forEach(function (rp) {
      var propertyId = leasePropertyId(rp.leaseId);
      if (!propertyId || !matchesProperty(propertyId) || !inRange(rp.date)) return;
      rows.push({ date: rp.date, propertyId: propertyId, type: "Income", category: "Rent", description: rp.note || rp.periodLabel || "Rent payment", amount: rp.amount });
    });

    data.maintenanceRequests.forEach(function (m) {
      var costDate = (m.createdAt || "").slice(0, 10);
      if (!(m.cost > 0) || !matchesProperty(m.propertyId) || !inRange(costDate)) return;
      rows.push({ date: costDate, propertyId: m.propertyId, type: "Expense", category: "Maintenance", description: m.title, amount: m.cost });
    });

    data.expenses.forEach(function (e) {
      if (!matchesProperty(e.propertyId) || !inRange(e.date)) return;
      rows.push({ date: e.date, propertyId: e.propertyId, type: "Expense", category: e.category || "Other", description: e.note || "", amount: e.amount });
    });

    rows.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    return rows;
  }

  function render() {
    data = PMS.getData();
    var ledger = computeLedger();

    var income = ledger.filter(function (r) { return r.type === "Income"; }).reduce(function (s, r) { return s + r.amount; }, 0);
    var expenseTotal = ledger.filter(function (r) { return r.type === "Expense"; }).reduce(function (s, r) { return s + r.amount; }, 0);
    var net = income - expenseTotal;

    var categoryTotals = {};
    ledger.filter(function (r) { return r.type === "Expense"; }).forEach(function (r) {
      categoryTotals[r.category] = (categoryTotals[r.category] || 0) + r.amount;
    });
    var categoryRows = Object.keys(categoryTotals).sort(function (a, b) { return categoryTotals[b] - categoryTotals[a]; });

    var propertyOptions = '<option value="all">All properties</option>' + data.properties.map(function (p) {
      return '<option value="' + p.id + '"' + (filters.propertyId === p.id ? " selected" : "") + ">" + PMSUI.escapeHtml(p.name) + "</option>";
    }).join("");

    var filterBar =
      '<div class="card" style="padding:16px;margin-bottom:20px;">' +
        '<div class="form-grid" style="grid-template-columns:repeat(3,1fr);gap:12px;">' +
          '<div class="field" style="margin:0;"><label>Property</label><select class="input" id="fFilterProperty">' + propertyOptions + "</select></div>" +
          '<div class="field" style="margin:0;"><label>From</label><input class="input" type="date" id="fFrom" value="' + filters.from + '"/></div>' +
          '<div class="field" style="margin:0;"><label>To</label><input class="input" type="date" id="fTo" value="' + filters.to + '"/></div>' +
        "</div>" +
      "</div>";

    var statGrid =
      '<div class="stat-grid">' +
        statCard(PMSUI.ICONS.download, PMS.formatCurrency(income, data.settings.currency), "Income (Rent Collected)", "") +
        statCard(PMSUI.ICONS.upload, PMS.formatCurrency(expenseTotal, data.settings.currency), "Total Expenses", "tone-danger") +
        statCard(PMSUI.ICONS.finances, PMS.formatCurrency(net, data.settings.currency), "Net", net >= 0 ? "tone-accent" : "tone-danger") +
      "</div>";

    var breakdownHtml = categoryRows.length === 0
      ? '<div class="card-body">' + PMSUI.emptyState("finances", "No expenses in this range", "Log an expense or widen the date range.") + "</div>"
      : '<div class="divider-list">' + categoryRows.map(function (cat) {
          return (
            '<div class="row"><div class="min-w-0"><p class="title truncate">' + PMSUI.escapeHtml(cat) + "</p></div>" +
            '<span class="title" style="font-weight:600;">' + PMS.formatCurrency(categoryTotals[cat], data.settings.currency) + "</span></div>"
          );
        }).join("") + "</div>";

    var recentExpenses = data.expenses
      .filter(function (e) { return matchesProperty(e.propertyId); })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; })
      .slice(0, 25);

    var expensesHtml = recentExpenses.length === 0
      ? '<div class="card-body">' + PMSUI.emptyState("finances", "No expenses logged yet", "Insurance, property tax, loan payments — log anything you spend per property here.") + "</div>"
      : '<div class="divider-list">' + recentExpenses.map(function (e) {
          return (
            '<div class="row">' +
              '<div class="min-w-0"><p class="title truncate">' + PMSUI.escapeHtml(e.category || "Other") + (e.note ? " — " + PMSUI.escapeHtml(e.note) : "") + "</p>" +
              '<p class="meta">' + PMSUI.escapeHtml(propertyName(e.propertyId)) + " · " + PMS.formatDate(e.date) + "</p></div>" +
              '<div style="display:flex;align-items:center;gap:10px;">' +
                '<span class="title" style="font-weight:600;">' + PMS.formatCurrency(e.amount, data.settings.currency) + "</span>" +
                '<button class="btn btn-ghost btn-sm" data-editexp="' + e.id + '">Edit</button>' +
                '<button class="btn-icon" data-delexp="' + e.id + '" aria-label="Delete expense">' + PMSUI.ICONS.trash + "</button>" +
              "</div>" +
            "</div>"
          );
        }).join("") + "</div>";

    shell.contentEl.innerHTML =
      filterBar + statGrid +
      '<div class="grid-2 mt-3">' +
        '<div class="card"><div class="card-header"><h2>Expenses by Category</h2></div>' + breakdownHtml + "</div>" +
        '<div class="card"><div class="card-header"><h2>Logged Expenses</h2></div>' + expensesHtml + "</div>" +
      "</div>";

    shell.contentEl.querySelector("#fFilterProperty").addEventListener("change", function (e) { filters.propertyId = e.target.value; render(); });
    shell.contentEl.querySelector("#fFrom").addEventListener("change", function (e) { filters.from = e.target.value || filters.from; render(); });
    shell.contentEl.querySelector("#fTo").addEventListener("change", function (e) { filters.to = e.target.value || filters.to; render(); });

    shell.contentEl.querySelectorAll("[data-editexp]").forEach(function (b) {
      b.addEventListener("click", function () { openExpenseModal(b.getAttribute("data-editexp")); });
    });
    shell.contentEl.querySelectorAll("[data-delexp]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-delexp");
        PMSUI.confirmDialog({
          title: "Delete this expense?",
          description: "This permanently removes it from your records.",
          confirmLabel: "Delete",
          onConfirm: function () { PMS.deleteExpense(id); PMSUI.toast("Expense deleted.", "info"); render(); },
        });
      });
    });
  }

  function statCard(icon, value, label, tone) {
    return (
      '<div class="stat-card ' + (tone || "") + '">' +
        '<div class="icon-wrap">' + icon + "</div>" +
        '<div class="value">' + PMSUI.escapeHtml(value) + "</div>" +
        '<div class="label">' + PMSUI.escapeHtml(label) + "</div>" +
      "</div>"
    );
  }

  function openExpenseModal(existingId) {
    if (data.properties.length === 0) { PMSUI.toast("Add a property first.", "error"); return; }
    var existing = existingId ? data.expenses.find(function (x) { return x.id === existingId; }) : null;
    var propertyOptions = data.properties.map(function (p) {
      return '<option value="' + p.id + '"' + (existing ? existing.propertyId === p.id : filters.propertyId === p.id ? " selected" : "") + ">" + PMSUI.escapeHtml(p.name) + "</option>";
    }).join("");
    var categoryDatalist = '<datalist id="categorySuggestions">' + PMS.EXPENSE_CATEGORIES.map(function (c) { return '<option value="' + c + '">'; }).join("") + "</datalist>";

    var body =
      '<div class="field"><label>Property<span class="req">*</span></label><select class="input" id="fProperty">' + propertyOptions + "</select></div>" +
      '<div class="form-grid">' +
        '<div class="field"><label>Category<span class="req">*</span></label><input class="input" id="fCategory" list="categorySuggestions" placeholder="Insurance, Levy, Loan Payment…" value="' + (existing ? PMSUI.escapeHtml(existing.category) : "") + '"/>' +
        '<span class="error hidden" id="fCategoryErr">Enter or pick a category.</span></div>' +
        '<div class="field"><label>Amount<span class="req">*</span></label><input class="input" type="number" min="0" id="fAmount" value="' + (existing ? existing.amount : "") + '"/></div>' +
      "</div>" +
      categoryDatalist +
      '<div class="field"><label>Date</label><input class="input" type="date" id="fDate" value="' + (existing ? existing.date : PMS.todayISO()) + '"/></div>' +
      '<div class="field"><label>Note</label><input class="input" id="fNote" placeholder="Optional" value="' + (existing ? PMSUI.escapeHtml(existing.note || "") : "") + '"/></div>';

    PMSUI.openModal({
      title: existing ? "Edit Expense" : "Log Expense",
      body: body,
      footer: '<button class="btn btn-ghost" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">' + (existing ? "Save Changes" : "Log Expense") + "</button>",
      onMount: function (root, close) {
        root.querySelector("#cancelBtn").addEventListener("click", close);
        root.querySelector("#saveBtn").addEventListener("click", function () {
          var category = root.querySelector("#fCategory").value.trim();
          var amount = Number(root.querySelector("#fAmount").value);
          if (!category) { root.querySelector("#fCategoryErr").classList.remove("hidden"); return; }
          if (!amount || amount <= 0) { PMSUI.toast("Enter a valid amount.", "error"); return; }
          var record = {
            propertyId: root.querySelector("#fProperty").value,
            category: category,
            amount: amount,
            date: root.querySelector("#fDate").value || PMS.todayISO(),
            note: root.querySelector("#fNote").value.trim(),
          };
          if (existing) { PMS.updateExpense(existing.id, record); PMSUI.toast("Expense updated."); }
          else { PMS.addExpense(record); PMSUI.toast("Expense logged."); }
          close();
          render();
        });
      },
    });
  }

  document.getElementById("addExpenseBtn").addEventListener("click", function () { openExpenseModal(null); });
  document.getElementById("exportBtn").addEventListener("click", function () {
    var ledger = computeLedger();
    if (!ledger.length) { PMSUI.toast("Nothing to export in this date range.", "error"); return; }
    var rows = ledger.map(function (r) {
      return {
        Date: r.date,
        Property: propertyName(r.propertyId),
        Type: r.type,
        Category: r.category,
        Description: r.description,
        Amount: r.amount,
        "Net Amount": r.type === "Income" ? r.amount : -r.amount,
      };
    });
    PMSUI.toast("Preparing Excel file…", "info");
    PMSUI.downloadWorkbook("Finances", rows, "finances_" + filters.from + "_to_" + filters.to + ".xlsx")
      .catch(function () { PMSUI.toast("Couldn't load the Excel export library — check your internet connection and try again.", "error"); });
  });

  render();
})();

</script>
</body>
</html>
