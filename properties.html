<style>
/* =========================================================
   Property Management System — Design System
   Pure black & white. No build step, no frameworks, no blue.
   ========================================================= */

:root {
  --bg: #000000;
  --surface: #000000;
  --surface-2: #0e0e0e;
  --surface-hover: #1a1a1a;
  --border: #262626;
  --border-strong: #404040;
  --text: #ffffff;
  --text-secondary: #a8a8a8;
  --text-tertiary: #707070;

  --accent: #ffffff;
  --accent-soft: rgba(255, 255, 255, 0.1);
  --accent-text: #ffffff;
  --accent-contrast: #000000;

  --success: #4ade80;
  --success-soft: rgba(74, 222, 128, 0.14);
  --warning: #facc15;
  --warning-soft: rgba(250, 204, 21, 0.14);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.14);

  --radius-lg: 16px;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.6);
  --shadow-2: 0 16px 40px -14px rgba(0, 0, 0, 0.85);
  --accent-glow: rgba(255, 255, 255, 0.28);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --sidebar-w: 248px;
}

/* Light theme — still pure black & white, just inverted. Toggle in
   Settings → Theme sets data-theme="light" on <html>. */
html[data-theme="light"] {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f2f2f2;
  --surface-hover: #e6e6e6;
  --border: #dcdcdc;
  --border-strong: #bfbfbf;
  --text: #000000;
  --text-secondary: #4d4d4d;
  --text-tertiary: #767676;

  --accent: #000000;
  --accent-soft: rgba(0, 0, 0, 0.08);
  --accent-text: #000000;
  --accent-contrast: #ffffff;

  --success: #15803d;
  --success-soft: rgba(21, 128, 61, 0.12);
  --warning: #b45309;
  --warning-soft: rgba(180, 83, 9, 0.12);
  --danger: #b91c1c;
  --danger-soft: rgba(185, 28, 28, 0.12);

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.08);
  --shadow-2: 0 16px 40px -14px rgba(0, 0, 0, 0.2);
  --accent-glow: rgba(0, 0, 0, 0.18);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}
a { color: inherit; }
button { font-family: inherit; }
h1, h2, h3, p { margin: 0; }
::selection { background: var(--accent-soft); color: var(--text); }

img { max-width: 100%; display: block; }

/* ---------- Layout ---------- */
.app {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  z-index: 40;
  transition: transform 0.25s ease;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 20px;
}
.brand-mark {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent-contrast); font-weight: 700; font-size: 15px;
  flex-shrink: 0;
  box-shadow: 0 4px 16px -4px var(--accent-glow);
}
.brand-text { min-width: 0; }
.brand-title { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11px; color: var(--text-tertiary); }

.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-link {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  transition: background 0.15s ease, color 0.15s ease;
}
.nav-link svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.9; }
.nav-link:hover { background: var(--surface-hover); color: var(--text); }
.nav-link.active { background: var(--accent-soft); color: var(--accent-text); }

.sidebar-footer {
  font-size: 10.5px;
  color: var(--text-tertiary);
  padding: 10px 12px 2px;
  border-top: 1px solid var(--border);
  margin-top: 10px;
}

.sidebar-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 35;
}

.mobile-topbar {
  display: none;
  position: sticky; top: 0;
  align-items: center; gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 30;
}
.mobile-menu-btn {
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  color: var(--text);
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}

.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 22px 32px 0;
}
.topbar h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.015em; }
.topbar .sub { margin-top: 3px; font-size: 13px; color: var(--text-secondary); }
.topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }

.content {
  padding: 20px 32px 56px;
  flex: 1;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  white-space: nowrap;
  padding: 8px 14px;
  text-decoration: none;
}
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }

/* Safety net: any inline SVG icon not covered by a more specific rule
   below still needs an explicit size, or Chromium can collapse it to
   0x0 inside auto-sized flex containers (a real, confirmed bug — not
   theoretical). Specific rules after this one win via normal cascade
   order/specificity, so this only fills gaps. */
svg { width: 16px; height: 16px; flex-shrink: 0; }
.mobile-menu-btn svg { width: 20px; height: 20px; }
.btn-icon svg { width: 16px; height: 16px; }
.card-link svg { width: 14px; height: 14px; }
.stat-card .icon-wrap svg { width: 18px; height: 18px; }
.empty .icon-wrap svg { width: 22px; height: 22px; }
.lock-mark svg { width: 20px; height: 20px; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-contrast); box-shadow: 0 6px 18px -8px var(--accent-glow); }
.btn-primary:hover:not(:disabled) { filter: brightness(0.9); }
.btn-secondary { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-hover); }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { filter: brightness(1.08); }
.btn-sm { padding: 6px 11px; font-size: 12.5px; }
.btn-icon { padding: 7px; border-radius: var(--radius-sm); background: transparent; border: none; color: var(--text-secondary); cursor: pointer; display: inline-flex; }
.btn-icon:hover { background: var(--danger-soft); color: var(--danger); }
.btn-icon.neutral:hover { background: var(--surface-hover); color: var(--text); }

/* ---------- Cards / stats ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 20px;
  border-bottom: 1px solid var(--border);
}
.card-header h2 { font-size: 13.5px; font-weight: 650; }
.card-link { font-size: 12px; font-weight: 600; color: var(--accent-text); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.card-link:hover { text-decoration: underline; }
.card-body { padding: 20px; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 18px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.stat-card .icon-wrap {
  width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-2); color: var(--text-secondary);
}
.stat-card.tone-accent .icon-wrap { background: var(--accent-soft); color: var(--accent-text); }
.stat-card.tone-danger .icon-wrap { background: var(--danger-soft); color: var(--danger); }
.stat-card .value { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.stat-card .label { font-size: 12.5px; color: var(--text-secondary); font-weight: 500; }
.stat-card .sub { font-size: 11px; color: var(--text-tertiary); }

/* ---------- Grid helpers ---------- */
.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.flex-col { display: flex; flex-direction: column; gap: 6px; }
.divider-list > * + * { border-top: 1px solid var(--border); }

/* ---------- List rows ---------- */
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 20px;
}
.row .title { font-size: 13.5px; font-weight: 600; color: var(--text); }
.row .meta { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

/* ---------- Pills ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 650;
  border: 1px solid transparent;
}
.pill-success { background: var(--success-soft); color: var(--success); }
.pill-warning { background: var(--warning-soft); color: var(--warning); }
.pill-danger { background: var(--danger-soft); color: var(--danger); }
.pill-neutral { background: var(--surface-2); color: var(--text-secondary); border-color: var(--border-strong); }
.pill-accent { background: var(--accent-soft); color: var(--accent-text); }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
.field label .req { color: var(--danger); margin-left: 2px; }
.field .hint { font-size: 11px; color: var(--text-tertiary); }
.field .error { font-size: 11.5px; color: var(--danger); }
.input, select.input, textarea.input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-size: 13.5px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input.has-error { border-color: var(--danger); }
textarea.input { resize: vertical; min-height: 72px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid.single { grid-template-columns: 1fr; }

/* ---------- Filters / tabs ---------- */
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--text-secondary);
  padding: 6px 13px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.chip:hover { background: var(--surface-hover); }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }

/* ---------- Empty state ---------- */
.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 8px; padding: 40px 20px;
  color: var(--text-secondary);
}
.empty .icon-wrap {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--surface-2); color: var(--text-tertiary);
  display: flex; align-items: center; justify-content: center; margin-bottom: 6px;
}
.empty h3 { font-size: 14px; font-weight: 650; color: var(--text); }
.empty p { font-size: 12.5px; max-width: 320px; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(4, 7, 11, 0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
  backdrop-filter: blur(2px);
  animation: fadeIn 0.15s ease;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  width: 100%; max-width: 480px;
  max-height: 88vh;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-2);
  animation: slideUp 0.18s ease;
}
.modal.modal-wide { max-width: 780px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 14.5px; font-weight: 650; }
.modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ---------- Data table (bank import review, etc.) ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); }
table.data-table { width: 100%; min-width: 640px; border-collapse: collapse; text-align: left; font-size: 12.5px; }
table.data-table thead tr { border-bottom: 1px solid var(--border); background: var(--surface-2); }
table.data-table th { padding: 10px 12px; font-size: 11px; font-weight: 650; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
table.data-table td { padding: 10px 12px; border-top: 1px solid var(--border); color: var(--text-secondary); vertical-align: middle; }
table.data-table tbody tr:hover { background: var(--surface-hover); }
table.data-table tr.row-disabled { opacity: 0.45; }
table.data-table select.input, table.data-table input.input { padding: 6px 8px; font-size: 12.5px; height: auto; }
.import-summary { font-size: 12.5px; color: var(--text-secondary); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
.import-warning { font-size: 12px; color: var(--warning); background: var(--warning-soft); border: 1px solid var(--warning); border-radius: var(--radius-sm); padding: 8px 12px; }

/* ---------- Toasts ---------- */
.toast-root {
  position: fixed; top: 16px; right: 16px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
  max-width: 320px;
}
.toast {
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--accent);
  color: var(--text);
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  font-weight: 500;
  box-shadow: var(--shadow-2);
  animation: slideUp 0.18s ease;
}
.toast.error { border-left-color: var(--danger); }
.toast.info { border-left-color: var(--text-tertiary); }

/* ---------- Accent swatches ---------- */
.swatch-row { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch {
  width: 40px; height: 40px; border-radius: 999px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.12s ease;
}
.swatch:hover { transform: scale(1.06); }
.swatch.active { border-color: var(--text); }

/* ---------- Skeleton ---------- */
.skeleton { background: var(--surface-2); border-radius: var(--radius); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* ---------- Utility ---------- */
.text-secondary { color: var(--text-secondary); }
.text-tertiary { color: var(--text-tertiary); }
.mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 14px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.min-w-0 { min-width: 0; }
.hidden { display: none !important; }
.logo-preview {
  width: 64px; height: 64px; border-radius: var(--radius);
  border: 1px solid var(--border-strong); background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
}
.logo-preview img { width: 100%; height: 100%; object-fit: contain; }

/* ---------- Lock screen (access-code gate) ---------- */
html:not(.unlocked) #app-shell,
html:not(.unlocked) .mobile-topbar {
  display: none !important;
}
.lock-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  padding: 20px;
}
.lock-card {
  width: 100%; max-width: 360px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 32px 28px;
  text-align: center;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: var(--shadow-2);
}
.lock-mark {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-contrast);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 18px;
  margin: 0 auto 4px;
}
.lock-card h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.lock-card p.lock-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: -8px; }
.lock-card .lock-error {
  display: none;
  font-size: 12px;
  color: var(--danger);
  margin-top: -6px;
}
.lock-card .lock-error.show { display: block; }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); box-shadow: var(--shadow-2); }
  body.sidebar-open .sidebar { transform: translateX(0); }
  body.sidebar-open .sidebar-backdrop { display: block; }
  .main { margin-left: 0; }
  .mobile-topbar { display: flex; }
  .topbar { padding: 18px 18px 0; flex-wrap: wrap; }
  .content { padding: 16px 18px 48px; }
  .topbar-actions .btn span.long { display: none; }
}

</style>
</head>
<body data-page="properties">
<div id="app-shell"></div>
<div class="toast-root" id="toast-root"></div>
<div id="modal-root"></div>

<script>
/* =========================================================
   Property Management System — Access Code Gate
   ---------------------------------------------------------
   HOW TO SET YOUR OWN PASSWORD:
   Change the text between the quotes on the next line to
   whatever code you want to give this customer, then save
   this file and re-upload it (this exact edit must be made
   in EVERY .html file if you're using the single-file
   version — see the README for the one-line find & replace).
   ========================================================= */
  var ACCESS_CODE = "property2026";
/* =========================================================
   IMPORTANT — read this before you rely on it:
   This is a simple front-door lock, not real security. This
   app has no server, so the code above lives inside the page
   itself — anyone who opens their browser's "View Page
   Source" or Developer Tools can read it. It's enough to stop
   casual visitors and people who don't have the code you gave
   them, but do not use it to protect anything truly sensitive,
   and assume a technical person could bypass it if they tried.
   ========================================================= */

(function () {
  "use strict";

  var STORAGE_KEY = "app_unlocked_v1";

  function isUnlocked() {
    try { return window.localStorage.getItem(STORAGE_KEY) === "1"; } catch (e) { return false; }
  }
  function markUnlocked() {
    document.documentElement.classList.add("unlocked");
    try { window.localStorage.setItem(STORAGE_KEY, "1"); } catch (e) {}
  }

  function showLockScreen() {
    var overlay = document.createElement("div");
    overlay.className = "lock-screen";
    overlay.innerHTML =
      '<div class="lock-card">' +
        '<div class="lock-mark">&#128274;</div>' +
        "<h1>Enter Access Code</h1>" +
        '<p class="lock-sub">Ask whoever set you up with this app for your access code.</p>' +
        '<input type="password" class="input" id="gateInput" placeholder="Access code" autocomplete="off" />' +
        '<p class="lock-error" id="gateError">That code isn\'t right. Try again.</p>' +
        '<button class="btn btn-primary" id="gateBtn" style="width:100%;justify-content:center;">Unlock</button>' +
      "</div>";
    document.body.appendChild(overlay);

    var input = overlay.querySelector("#gateInput");
    var err = overlay.querySelector("#gateError");

    function attempt() {
      if (input.value === ACCESS_CODE) {
        markUnlocked();
        overlay.remove();
      } else {
        err.classList.add("show");
        input.value = "";
        input.focus();
      }
    }

    overlay.querySelector("#gateBtn").addEventListener("click", attempt);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") attempt();
    });
    setTimeout(function () { input.focus(); }, 60);
  }

  if (isUnlocked()) {
    document.documentElement.classList.add("unlocked");
  } else {
    document.documentElement.classList.remove("unlocked");
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", showLockScreen);
    } else {
      showLockScreen();
    }
  }
})();

</script>
<script>
/* =========================================================
   Property Management System — Data Layer
   Plain JavaScript, no build step. All data lives in this
   browser's localStorage. Loaded before every other script.
   ========================================================= */

(function (global) {
  "use strict";

  var STORAGE_KEY = "pms_data_v1";
  var SCHEMA_VERSION = 1;

  var DEFAULT_SETTINGS = {
    landlordName: "Your Company",
    email: "",
    phone: "",
    address: "",
    currency: "USD",
    customSymbol: "",
    theme: "dark",
    defaultDueDay: 1,
    reminderLeadDays: 5,
    accentColor: "blue",
    logoDataUrl: null,
  };

  function emptyData() {
    return {
      version: SCHEMA_VERSION,
      properties: [],
      tenants: [],
      leases: [],
      rentPayments: [],
      maintenanceRequests: [],
      settings: Object.assign({}, DEFAULT_SETTINGS),
    };
  }

  // ---- in-memory fallback in case localStorage is unavailable
  // (private browsing, disabled storage, etc.)
  var memoryFallback = null;

  function safeGetItem() {
    try {
      return window.localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      return memoryFallback;
    }
  }
  function safeSetItem(value) {
    try {
      window.localStorage.setItem(STORAGE_KEY, value);
    } catch (e) {
      memoryFallback = value;
    }
  }

  function load() {
    var raw = safeGetItem();
    if (!raw) return emptyData();
    try {
      var parsed = JSON.parse(raw);
      var base = emptyData();
      return Object.assign({}, base, parsed, {
        settings: Object.assign({}, DEFAULT_SETTINGS, parsed.settings || {}),
        properties: parsed.properties || [],
        tenants: parsed.tenants || [],
        leases: parsed.leases || [],
        rentPayments: parsed.rentPayments || [],
        maintenanceRequests: parsed.maintenanceRequests || [],
      });
    } catch (e) {
      console.warn("PMS: could not parse saved data, starting fresh.", e);
      return emptyData();
    }
  }

  var data = load();

  function persist() {
    safeSetItem(JSON.stringify(data));
  }

  // ---------- helpers ----------
  function uid() {
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }
  function nowISO() {
    return new Date().toISOString();
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function pad2(n) {
    return n < 10 ? "0" + n : "" + n;
  }

  // ---------- properties ----------
  function addProperty(input) {
    var rec = Object.assign({}, input, { id: uid(), createdAt: nowISO() });
    data.properties.push(rec);
    persist();
    return rec;
  }
  function updateProperty(id, patch) {
    var p = data.properties.find(function (x) { return x.id === id; });
    if (!p) return;
    Object.assign(p, patch);
    persist();
  }
  function deleteProperty(id) {
    data.properties = data.properties.filter(function (x) { return x.id !== id; });
    var leaseIds = data.leases.filter(function (l) { return l.propertyId === id; }).map(function (l) { return l.id; });
    data.leases = data.leases.filter(function (l) { return l.propertyId !== id; });
    data.rentPayments = data.rentPayments.filter(function (rp) { return leaseIds.indexOf(rp.leaseId) === -1; });
    data.maintenanceRequests = data.maintenanceRequests.filter(function (m) { return m.propertyId !== id; });
    persist();
  }
  function activeLeaseForProperty(propertyId) {
    return data.leases.find(function (l) { return l.propertyId === propertyId && l.status === "active"; }) || null;
  }

  // ---------- tenants ----------
  function addTenant(input) {
    var rec = Object.assign({}, input, { id: uid(), createdAt: nowISO() });
    data.tenants.push(rec);
    persist();
    return rec;
  }
  function updateTenant(id, patch) {
    var t = data.tenants.find(function (x) { return x.id === id; });
    if (!t) return;
    Object.assign(t, patch);
    persist();
  }
  function deleteTenant(id) {
    data.tenants = data.tenants.filter(function (x) { return x.id !== id; });
    persist();
  }

  // ---------- leases ----------
  function addLease(input) {
    var rec = Object.assign({}, input, { id: uid(), status: "active", createdAt: nowISO() });
    data.leases.push(rec);
    persist();
    return rec;
  }
  function endLease(id) {
    var l = data.leases.find(function (x) { return x.id === id; });
    if (!l) return;
    l.status = "ended";
    l.endDate = todayISO();
    persist();
  }
  function deleteLease(id) {
    data.leases = data.leases.filter(function (x) { return x.id !== id; });
    data.rentPayments = data.rentPayments.filter(function (rp) { return rp.leaseId !== id; });
    persist();
  }

  // ---------- rent payments ----------
  function addRentPayment(input) {
    var rec = Object.assign({}, input, { id: uid(), createdAt: nowISO() });
    data.rentPayments.push(rec);
    persist();
    return rec;
  }
  function deleteRentPayment(id) {
    data.rentPayments = data.rentPayments.filter(function (x) { return x.id !== id; });
    persist();
  }

  // ---------- maintenance ----------
  function addMaintenanceRequest(input) {
    var rec = Object.assign({}, input, { id: uid(), createdAt: nowISO() });
    data.maintenanceRequests.push(rec);
    persist();
    return rec;
  }
  function updateMaintenanceRequest(id, patch) {
    var m = data.maintenanceRequests.find(function (x) { return x.id === id; });
    if (!m) return;
    Object.assign(m, patch);
    persist();
  }
  function deleteMaintenanceRequest(id) {
    data.maintenanceRequests = data.maintenanceRequests.filter(function (x) { return x.id !== id; });
    persist();
  }

  // ---------- settings ----------
  function updateSettings(patch) {
    data.settings = Object.assign({}, data.settings, patch);
    persist();
  }

  // ---------- rent math ----------
  function currentPeriodLabel(refISO) {
    var d = refISO ? new Date(refISO + "T00:00:00") : new Date();
    var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    return months[d.getMonth()] + " " + d.getFullYear();
  }
  function periodKey(refISO) {
    var d = refISO ? new Date(refISO + "T00:00:00") : new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
  }
  function daysInMonth(year, monthIndex) {
    return new Date(year, monthIndex + 1, 0).getDate();
  }
  function dueDateForCurrentPeriod(dueDay, refISO) {
    var ref = refISO ? new Date(refISO + "T00:00:00") : new Date();
    var year = ref.getFullYear();
    var month = ref.getMonth();
    var clampedDay = Math.min(Math.max(dueDay || 1, 1), daysInMonth(year, month));
    var due = new Date(year, month, clampedDay);
    return due.getFullYear() + "-" + pad2(due.getMonth() + 1) + "-" + pad2(due.getDate());
  }
  function daysBetween(fromISO, toISO) {
    var from = new Date(fromISO + "T00:00:00");
    var to = new Date(toISO + "T00:00:00");
    return Math.round((to.getTime() - from.getTime()) / 86400000);
  }
  function amountPaidForPeriod(leaseId, period) {
    return data.rentPayments
      .filter(function (rp) { return rp.leaseId === leaseId && rp.periodLabel === period; })
      .reduce(function (sum, rp) { return sum + rp.amount; }, 0);
  }
  function computeLeaseRentInfo(lease, reminderLeadDays, todayOverride) {
    var today = todayOverride || todayISO();
    var period = currentPeriodLabel(today);
    var dueDate = dueDateForCurrentPeriod(lease.dueDay, today);
    var paid = amountPaidForPeriod(lease.id, period);
    var balance = Math.max(lease.rentAmount - paid, 0);
    var daysUntilDue = daysBetween(today, dueDate);
    var status;
    if (balance <= 0) status = "paid";
    else if (daysUntilDue < 0) status = "overdue";
    else if (daysUntilDue <= (reminderLeadDays || 0)) status = "due-soon";
    else status = "upcoming";
    return { lease: lease, period: period, dueDate: dueDate, daysUntilDue: daysUntilDue, paid: paid, balance: balance, status: status };
  }

  // ---------- formatting ----------
  // code -> [locale, symbol]. Locale mainly affects number grouping; the
  // symbol here is only used for the Settings dropdown preview and as a
  // fallback if Intl can't format a given code in this browser.
  var CURRENCY_META = {
    USD: ["en-US", "$"], EUR: ["de-DE", "€"], GBP: ["en-GB", "£"], INR: ["en-IN", "₹"],
    AUD: ["en-AU", "$"], CAD: ["en-CA", "$"], NZD: ["en-NZ", "$"], SGD: ["en-SG", "$"],
    HKD: ["en-HK", "$"], JPY: ["ja-JP", "¥"], CNY: ["zh-CN", "¥"], KRW: ["ko-KR", "₩"],
    CHF: ["de-CH", "CHF"], SEK: ["sv-SE", "kr"], NOK: ["nb-NO", "kr"], DKK: ["da-DK", "kr"],
    PLN: ["pl-PL", "zł"], CZK: ["cs-CZ", "Kč"], HUF: ["hu-HU", "Ft"], RON: ["ro-RO", "lei"],
    TRY: ["tr-TR", "₺"], RUB: ["ru-RU", "₽"], ZAR: ["en-ZA", "R"], NGN: ["en-NG", "₦"],
    EGP: ["ar-EG", "E£"], KES: ["en-KE", "KSh"], AED: ["ar-AE", "د.إ"], SAR: ["ar-SA", "﷼"],
    QAR: ["ar-QA", "﷼"], KWD: ["ar-KW", "د.ك"], ILS: ["he-IL", "₪"], THB: ["th-TH", "฿"],
    IDR: ["id-ID", "Rp"], MYR: ["ms-MY", "RM"], PHP: ["en-PH", "₱"], VND: ["vi-VN", "₫"],
    PKR: ["en-PK", "₨"], BDT: ["bn-BD", "৳"], LKR: ["en-LK", "₨"], NPR: ["ne-NP", "₨"],
    BRL: ["pt-BR", "R$"], MXN: ["es-MX", "$"], ARS: ["es-AR", "$"], CLP: ["es-CL", "$"],
    COP: ["es-CO", "$"], PEN: ["es-PE", "S/"], TWD: ["zh-TW", "NT$"],
  };
  function currencySymbol(code) {
    var meta = CURRENCY_META[code];
    return meta ? meta[1] : code;
  }
  function formatCurrency(amount, currency) {
    var amt = amount || 0;
    var customSymbol = data.settings && data.settings.customSymbol;
    if (customSymbol) {
      var numStr = Math.abs(amt).toLocaleString(undefined, { maximumFractionDigits: 0 });
      return (amt < 0 ? "-" : "") + customSymbol + numStr;
    }
    var cur = currency || "USD";
    var meta = CURRENCY_META[cur];
    try {
      return new Intl.NumberFormat((meta && meta[0]) || "en-US", { style: "currency", currency: cur, maximumFractionDigits: 0 }).format(amt);
    } catch (e) {
      return currencySymbol(cur) + Math.round(amt).toLocaleString();
    }
  }
  function formatDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  // ---------- backup / restore ----------
  function exportData() {
    return JSON.stringify(data, null, 2);
  }
  function importData(json) {
    try {
      var parsed = JSON.parse(json);
      if (!parsed || typeof parsed !== "object") return { ok: false, error: "That file doesn't look like a valid backup." };
      var base = emptyData();
      data = Object.assign({}, base, parsed, {
        settings: Object.assign({}, DEFAULT_SETTINGS, parsed.settings || {}),
        properties: parsed.properties || [],
        tenants: parsed.tenants || [],
        leases: parsed.leases || [],
        rentPayments: parsed.rentPayments || [],
        maintenanceRequests: parsed.maintenanceRequests || [],
      });
      persist();
      return { ok: true };
    } catch (e) {
      return { ok: false, error: "Could not read that file. Make sure it's an unedited backup .json file." };
    }
  }
  function resetAllData() {
    data = emptyData();
    persist();
  }

  global.PMS = {
    getData: function () { return data; },
    uid: uid,
    nowISO: nowISO,
    todayISO: todayISO,

    addProperty: addProperty,
    updateProperty: updateProperty,
    deleteProperty: deleteProperty,
    activeLeaseForProperty: activeLeaseForProperty,

    addTenant: addTenant,
    updateTenant: updateTenant,
    deleteTenant: deleteTenant,

    addLease: addLease,
    endLease: endLease,
    deleteLease: deleteLease,

    addRentPayment: addRentPayment,
    deleteRentPayment: deleteRentPayment,

    addMaintenanceRequest: addMaintenanceRequest,
    updateMaintenanceRequest: updateMaintenanceRequest,
    deleteMaintenanceRequest: deleteMaintenanceRequest,

    updateSettings: updateSettings,

    currentPeriodLabel: currentPeriodLabel,
    periodKey: periodKey,
    dueDateForCurrentPeriod: dueDateForCurrentPeriod,
    computeLeaseRentInfo: computeLeaseRentInfo,

    formatCurrency: formatCurrency,
    formatDate: formatDate,
    currencySymbol: currencySymbol,
    CURRENCY_CODES: Object.keys(CURRENCY_META),

    exportData: exportData,
    importData: importData,
    resetAllData: resetAllData,
  };
})(window);

</script>

    );
    root.appendChild(backdrop);
    var bodyEl = backdrop.querySelector("#modalBody");
    var footerEl = backdrop.querySelector("#modalFooter");
    if (opts.body instanceof Node) bodyEl.appendChild(opts.body);
    else bodyEl.innerHTML = opts.body || "";
    if (opts.footer instanceof Node) footerEl.appendChild(opts.footer);
    else footerEl.innerHTML = opts.footer || "";

    function close() { backdrop.remove(); }
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) close(); });
    backdrop.querySelector("#modalCloseBtn").addEventListener("click", close);

    if (opts.onMount) opts.onMount(backdrop, close);
    return { close: close, el: backdrop };
  }

  function confirmDialog(opts) {
    openModal({
      title: opts.title,
      body: '<p class="text-secondary">' + escapeHtml(opts.description) + "</p>",
      footer:
        '<button class="btn btn-ghost" id="cdCancel">Cancel</button>' +
        '<button class="btn btn-danger" id="cdConfirm">' + escapeHtml(opts.confirmLabel || "Delete") + "</button>",
      onMount: function (root, close) {
        root.querySelector("#cdCancel").addEventListener("click", close);
        root.querySelector("#cdConfirm").addEventListener("click", function () {
          close();
          opts.onConfirm();
        });
      },
    });
  }

  // ---------- small helpers ----------
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function emptyState(iconKey, title, desc, actionHtml) {
    return (
      '<div class="empty"><div class="icon-wrap">' + (ICONS[iconKey] || "") + "</div>" +
      "<h3>" + escapeHtml(title) + "</h3><p>" + escapeHtml(desc) + "</p>" +
      (actionHtml ? '<div class="mt-2">' + actionHtml + "</div>" : "") +
      "</div>"
    );
  }

  global.PMSUI = {
    ICONS: ICONS,
    renderShell: renderShell,
    toast: toast,
    openModal: openModal,
    confirmDialog: confirmDialog,
    escapeHtml: escapeHtml,
    emptyState: emptyState,
    el: el,
    applyAccent: applyAccent,
    BUILD_DATE: BUILD_DATE,
  };
})(window);

</script>
<script>
/* Properties page */
(function () {
  "use strict";

  var shell = PMSUI.renderShell("properties");
  var data = PMS.getData();

  shell.setTitle("Properties", data.properties.length + " total");
  shell.setActions('<button class="btn btn-primary" id="addPropertyBtn">' + PMSUI.ICONS.plus + '<span class="long">New Property</span></button>');

  function tenantName(id) {
    var t = data.tenants.find(function (x) { return x.id === id; });
    return t ? t.name : "Unknown tenant";
  }

  function render() {
    data = PMS.getData();
    shell.setTitle("Properties", data.properties.length + " total");

    if (data.properties.length === 0) {
      shell.contentEl.innerHTML = PMSUI.emptyState(
        "properties", "No properties yet", "Add your first property to start tracking tenants and rent.",
        '<button class="btn btn-primary btn-sm" id="emptyAddBtn">' + PMSUI.ICONS.plus + " Add Property</button>"
      );
      var eb = document.getElementById("emptyAddBtn");
      if (eb) eb.addEventListener("click", openAddModal);
      return;
    }

    shell.contentEl.innerHTML = '<div class="grid-auto">' + data.properties.map(function (p) {
      var lease = PMS.activeLeaseForProperty(p.id);
      return (
        '<div class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px;">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">' +
            '<div class="min-w-0"><p class="title truncate" style="font-size:14.5px;font-weight:650;">' + PMSUI.escapeHtml(p.name) + "</p>" +
            '<p class="meta text-tertiary" style="margin-top:2px;">' + PMSUI.escapeHtml(p.address || "No address on file") + "</p></div>" +
            '<button class="btn-icon" data-delete="' + p.id + '" aria-label="Delete property">' + PMSUI.ICONS.trash + "</button>" +
          "</div>" +
          (p.notes ? '<p class="text-secondary" style="font-size:12.5px;">' + PMSUI.escapeHtml(p.notes) + "</p>" : "") +
          '<div style="margin-top:4px;">' +
            (lease
              ? '<span class="pill pill-success">Occupied</span> <span class="text-tertiary" style="font-size:12px;">' + PMSUI.escapeHtml(tenantName(lease.tenantId)) + " · " + PMS.formatCurrency(lease.rentAmount, data.settings.currency) + "/mo</span>"
              : '<span class="pill pill-neutral">Vacant</span>') +
          "</div>" +
          '<div style="display:flex;gap:8px;margin-top:6px;border-top:1px solid var(--border);padding-top:12px;">' +
            (lease
              ? '<button class="btn btn-secondary btn-sm" data-endlease="' + lease.id + '">End Lease</button>'
              : '<button class="btn btn-secondary btn-sm" data-assign="' + p.id + '">Assign Tenant</button>') +
            '<button class="btn btn-ghost btn-sm" data-edit="' + p.id + '">Edit</button>' +
          "</div>" +
        "</div>"
      );
    }).join("") + "</div>";

    shell.contentEl.querySelectorAll("[data-delete]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-delete");
        PMSUI.confirmDialog({
          title: "Delete property?",
          description: "This also removes its lease and rent payment history. This cannot be undone.",
          confirmLabel: "Delete",
          onConfirm: function () { PMS.deleteProperty(id); PMSUI.toast("Property deleted.", "info"); render(); },
        });
      });
    });
    shell.contentEl.querySelectorAll("[data-edit]").forEach(function (b) {
      b.addEventListener("click", function () { openEditModal(b.getAttribute("data-edit")); });
    });
    shell.contentEl.querySelectorAll("[data-assign]").forEach(function (b) {
      b.addEventListener("click", function () { openAssignModal(b.getAttribute("data-assign")); });
    });
    shell.contentEl.querySelectorAll("[data-endlease]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-endlease");
        PMSUI.confirmDialog({
          title: "End this lease?",
          description: "The property will be marked vacant. Past rent payment history is kept.",
          confirmLabel: "End Lease",
          onConfirm: function () { PMS.endLease(id); PMSUI.toast("Lease ended."); render(); },
        });
      });
    });
  }

  function propertyFormBody(existing) {
    return (
      '<div class="field"><label>Property name<span class="req">*</span></label>' +
      '<input class="input" id="fName" placeholder="123 Main St — Unit A" value="' + (existing ? PMSUI.escapeHtml(existing.name) : "") + '"/>' +
      '<span class="error hidden" id="fNameErr">Give this property a name.</span></div>' +
      '<div class="field"><label>Address</label>' +
      '<input class="input" id="fAddress" placeholder="Street, city, state" value="' + (existing ? PMSUI.escapeHtml(existing.address || "") : "") + '"/></div>' +
      '<div class="field"><label>Notes</label>' +
      '<textarea class="input" id="fNotes" rows="3" placeholder="Anything worth remembering about this unit">' + (existing ? PMSUI.escapeHtml(existing.notes || "") : "") + "</textarea></div>"
    );
  }

  function openAddModal() {
    var modal = PMSUI.openModal({
      title: "New Property",
      body: propertyFormBody(null),
      footer: '<button class="btn btn-ghost" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">Add Property</button>',
      onMount: function (root, close) {
        root.querySelector("#cancelBtn").addEventListener("click", close);
        root.querySelector("#saveBtn").addEventListener("click", function () {
          var name = root.querySelector("#fName").value.trim();
          if (!name) { root.querySelector("#fName").classList.add("has-error"); root.querySelector("#fNameErr").classList.remove("hidden"); return; }
          PMS.addProperty({
            name: name,
            address: root.querySelector("#fAddress").value.trim(),
            notes: root.querySelector("#fNotes").value.trim(),
          });
          PMSUI.toast("Property added.");
          close();
          render();
        });
      },
    });
    return modal;
  }

  function openEditModal(id) {
    var p = data.properties.find(function (x) { return x.id === id; });
    if (!p) return;
    PMSUI.openModal({
      title: "Edit Property",
      body: propertyFormBody(p),
      footer: '<button class="btn btn-ghost" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">Save Changes</button>',
      onMount: function (root, close) {
        root.querySelector("#cancelBtn").addEventListener("click", close);
        root.querySelector("#saveBtn").addEventListener("click", function () {
          var name = root.querySelector("#fName").value.trim();
          if (!name) { root.querySelector("#fName").classList.add("has-error"); root.querySelector("#fNameErr").classList.remove("hidden"); return; }
          PMS.updateProperty(id, {
            name: name,
            address: root.querySelector("#fAddress").value.trim(),
            notes: root.querySelector("#fNotes").value.trim(),
          });
          PMSUI.toast("Property updated.");
          close();
          render();
        });
      },
    });
  }

  function openAssignModal(propertyId) {
    if (data.tenants.length === 0) {
      PMSUI.toast("Add a tenant first, then assign them here.", "error");
      return;
    }
    var tenantOptions = data.tenants.map(function (t) { return '<option value="' + t.id + '">' + PMSUI.escapeHtml(t.name) + "</option>"; }).join("");
    var body =
      '<div class="field"><label>Tenant<span class="req">*</span></label><select class="input" id="fTenant">' + tenantOptions + "</select></div>" +
      '<div class="form-grid">' +
        '<div class="field"><label>Monthly rent<span class="req">*</span></label><input class="input" type="number" min="0" id="fRent" placeholder="1500"/></div>' +
        '<div class="field"><label>Due day of month</label><input class="input" type="number" min="1" max="31" id="fDueDay" value="' + data.settings.defaultDueDay + '"/></div>' +
      "</div>" +
      '<div class="field"><label>Lease start date</label><input class="input" type="date" id="fStart" value="' + PMS.todayISO() + '"/></div>';

    PMSUI.openModal({
      title: "Assign Tenant",
      body: body,
      footer: '<button class="btn btn-ghost" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">Assign</button>',
      onMount: function (root, close) {
        root.querySelector("#cancelBtn").addEventListener("click", close);
        root.querySelector("#saveBtn").addEventListener("click", function () {
          var rent = Number(root.querySelector("#fRent").value);
          if (!rent || rent <= 0) { PMSUI.toast("Enter a valid monthly rent amount.", "error"); return; }
          PMS.addLease({
            propertyId: propertyId,
            tenantId: root.querySelector("#fTenant").value,
            rentAmount: rent,
            dueDay: Number(root.querySelector("#fDueDay").value) || 1,
            startDate: root.querySelector("#fStart").value || PMS.todayISO(),
          });
          PMSUI.toast("Tenant assigned.");
          close();
          render();
        });
      },
    });
  }

  document.getElementById("addPropertyBtn").addEventListener("click", openAddModal);
  render();
})();

</script>
</body>
</html>
